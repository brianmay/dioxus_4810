[package]
name = "my_dioxus_app"
version = "0.1.0"
authors = ["Brian May <brian@linuxpenguins.xyz>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.6", optional = true }
axum-macros = { version = "0.5.0", optional = true }
dioxus = { version = "0.7.0-rc.2", features = [ "fullstack" ] }
dioxus-fullstack = { version = "0.7.0-rc.2" }
# dioxus = { version = "0.7.0-rc.2", features = [ "fullstack" ], path = "/home/brian/tree/3rdparty/dioxus/packages/dioxus" }
# dioxus-fullstack = { version = "0.7.0-rc.2", path = "/home/brian/tree/3rdparty/dioxus/packages/fullstack" }
getrandom = { version = "0.3.4", features = ["wasm_js"] }
wasm-bindgen = "0.2.100"
wasm-bindgen-cli = "0.2.100"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "axum", "axum-macros"]
